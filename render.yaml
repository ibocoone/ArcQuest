# Serveur ArcQuest sur Render (offre gratuite). La base Postgres est hébergée à part (Neon).
services:
  - type: web
    name: arcquest-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /me
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: VITE_VAULT_ADDRESS
        value: "0xf0848d4325a1cbf85f4c1539194a61036df09b64"
      - key: ADMIN_WALLETS
        sync: false
      - key: CLAIM_SIGNER_PRIVATE_KEY
        sync: false
      - key: PUBLIC_URL
        value: "https://arcquest-api-trh8.onrender.com"
